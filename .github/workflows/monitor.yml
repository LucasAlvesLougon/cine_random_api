name: Monitor Backend

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    name: Check health and metrics
    runs-on: ubuntu-latest
    steps:
      - name: Check API readiness
        env:
          API_URL: ${{ secrets.RENDER_API_URL }}
        run: |
          test -n "$API_URL"
          curl --fail --silent --show-error --max-time 30 "$API_URL/health/ready" > /dev/null

      - name: Check metrics endpoint
        env:
          API_URL: ${{ secrets.RENDER_API_URL }}
        run: |
          curl --fail --silent --show-error --max-time 30 "$API_URL/metrics" | grep -q "cine_random_http_requests_total"
