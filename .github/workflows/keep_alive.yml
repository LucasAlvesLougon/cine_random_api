name: Keep Alive Render API

on:
  schedule:
    # Fallback gratuito. UptimeRobot a cada 5 min é o monitor principal recomendado.
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping API Healthcheck
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        env:
          API_URL: ${{ secrets.RENDER_API_URL }}
        run: |
          if [ -z "${API_URL}" ]; then
            echo "Configure o secret RENDER_API_URL com a URL pública real da API."
            exit 1
          fi
          echo "Pinging ${API_URL}/health/ready..."
          RESPONSE=$(curl --fail --silent --show-error --max-time 30 -w "%{http_code}" -o /dev/null "${API_URL}/health/ready")
          echo "HTTP Status: ${RESPONSE}"
          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 400 ]; then
            echo "API está ativa e acordada!"
          else
            echo "Aviso: Status HTTP ${RESPONSE}"
          fi
