name: Backend CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

permissions:
  contents: read

jobs:
  test:
    name: Run Pytest Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install Dependencies
        run: uv sync --frozen

      - name: Run Automated Tests with Coverage Gate
        run: uv run pytest -v --cov=services --cov=routers --cov=utils --cov-report=term-missing --cov-fail-under=35
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci_test_secret_key_super_secure_32_bytes_long_minimum' }}
          DATABASE_URL: sqlite:///./ci_test.db

      - name: Audit Python Dependencies
        run: uv run pip-audit

  auto-sync:
    name: Promote dev to master
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync from dev to master
        run: |
          git checkout master
          git merge origin/dev --ff-only || git merge origin/dev -m "ci: auto-sync dev into master [skip ci]"
          git push origin master
