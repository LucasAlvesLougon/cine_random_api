name: Backend CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

permissions:
  contents: write

jobs:
  test:
    name: Run Pytest Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install Dependencies
        run: uv sync --frozen

      - name: Run Automated Tests
        run: uv run pytest -v
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci_test_secret_key_super_secure_32_bytes_long_minimum' }}
          DATABASE_URL: sqlite:///./ci_test.db

  auto-sync:
    name: Auto Sync Branches (dev <-> master)
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync from dev to master
        if: github.ref == 'refs/heads/dev'
        run: |
          git checkout master
          git merge origin/dev --ff-only || git merge origin/dev -m "ci: auto-sync dev into master [skip ci]"
          git push origin master

      - name: Sync from master to dev
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        run: |
          git checkout dev
          git merge origin/master --ff-only || git merge origin/master -m "ci: auto-sync master into dev [skip ci]"
          git push origin dev
