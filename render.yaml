services:
  - type: web
    name: cine-random-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cine-random-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  - type: psql
    name: cine-random-db
    plan: free
